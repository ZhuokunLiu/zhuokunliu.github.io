- title: "Stereotypes and Memory"
  coauthors: "Huen Tat Au-Yeung"
  abstract: >
    Imperfect memory can sustain widely held stereotypes that are inaccurate. To establish causal evidence, we conduct an online experiment where subjects grade a gender-stereotyped quiz and later predict the performance of the same group on a similar quiz. We vary (1) reliance on memory by manipulating access to grading records and (2) the sample of quiz-takers by manipulating the gender performance gap in the quiz. Defining the perceived gender performance gap as stereotypes, we find that stereotypes persist more strongly when subjects rely on memory, but only when the gap in the quiz is in the opposite direction of the stereotypes. Then, we extend the standard Bayesian framework to incorporate imperfect memory and find evidence of memory attenuation: subjects place less weight on graded quiz performance by 50%, due to uncertainty and potential contamination in recall, with contamination accounting for 72% of the effect.

- title: "Communication and the Polarization of Trust Attitudes"
  coauthors: "Ferdinand von Siemens"
  abstract: >
    Given the critical role of generalized trust in the functioning of both public and private organizations, it is important to better understand the factors driving the substantial differences in trust across states, regions, and organizations. Group polarization theory suggests that communication might foster consensus within, while increasing differences across social groups. To test this argument, we conduct an online experiment in which some participants communicate before playing separate trust games. Participants only communicate with other participants in the same role -- trustors talk with other trustors. Our results show that communication does not affect average trust. instead, chatting reduces the variation in trust within, while increasing trust differences between the chat groups, thus leading to a polarization of trust cultures. We further find that groups that develop strong positive trust cultures focus in their discussions on both moral principles and self-interest. Consequently, appealing to enlightened self-interest might thus be a good communication strategy to build positive trust cultures.


