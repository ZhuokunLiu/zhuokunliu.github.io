works:

- title: "Discrimination and Memory"
  coauthors: "Huen Tat Au-Yeung"
  abstract: >
    Previous studies suggest that inaccurate stereotypes can be driven by imperfect memory. 
    We provide experimental evidence by manipulating the reliance on memory with memory aids. 
    Participants perform a grading task for a quiz in a gender-stereotyped domain. 
    Our findings show that stereotypes contaminate recall, leading to biased beliefs. 
    While memory aids improve the selection of the best, they can also justify stereotypical decisions. 
    Finally, we find that the stereotype bias is not reflected in individual performance assessments but emerges only at the gender group level.

- title: "Communication and the Emergence of Distinct Organizational Trust Cultures"
